services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fieldsync
      POSTGRES_PASSWORD: fieldsync
      POSTGRES_DB: fieldsync
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldsync"]
      interval: 3s
      retries: 20
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 3001
      DATABASE_URL: postgres://fieldsync:fieldsync@postgres:5432/fieldsync
      DB_POOL_MAX: 20
      SEED_DEMO: "true"
      CORS_ORIGINS: http://localhost:3000
      CHANGELOG_RETENTION_SECONDS: 604800
      CLIENT_RETENTION_DAYS: 90
      GC_INTERVAL_MS: 3600000
      STREAM_HEARTBEAT_MS: 25000
      STREAM_MAX_PER_USER: 10
      LOG_LEVEL: info
      METRICS_TOKEN: ""
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3001:3001"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on: [server]
    ports: ["3000:3000"]
