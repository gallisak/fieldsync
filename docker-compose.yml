services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldsync}
      POSTGRES_DB: ${POSTGRES_DB:-fieldsync}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 3s
      retries: 20
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-fieldsync}:${POSTGRES_PASSWORD:-fieldsync}@postgres:5432/${POSTGRES_DB:-fieldsync}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["3001:3001"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      server:
        condition: service_healthy
    ports: ["3000:3000"]
